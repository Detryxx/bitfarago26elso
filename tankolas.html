<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
		<title>Document</title>
		<script src="tankolas_storage.js"></script>
		<script src="time.js"></script>
		<link rel="stylesheet" href="style.css" />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0&icon_names=delete"
		/>
		<script
			type="text/javascript"
			src="https://cdn.jsdelivr.net/jquery/latest/jquery.min.js"
		></script>
		<script
			type="text/javascript"
			src="https://cdn.jsdelivr.net/momentjs/latest/moment.min.js"
		></script>
		<script
			type="text/javascript"
			src="https://cdn.jsdelivr.net/npm/daterangepicker/daterangepicker.min.js"
		></script>
		<link
			rel="stylesheet"
			type="text/css"
			href="https://cdn.jsdelivr.net/npm/daterangepicker/daterangepicker.css"
		/>
	</head>
	<body
		class="bg-linear-to-r from-green-200 from-30% via-purple-200 via-60% to-amber-200"
	>
		<div
			class="sticky top-0 z-100 h-auto rounded-b-md bg-gray-500 py-4 text-center text-4xl"
		>
			<div class="grid grid-cols-5 justify-center">
				<div class="col-span-1"></div>
				<div class="col-span-3">
					<span
						class="mx-5 rounded-xl border border-gray-400 bg-gray-400 px-3 hover:text-gray-300"
						><a href="./index.html">Othhon</a></span
					>
					<span
						class="mx-5 rounded-xl border border-gray-400 bg-gray-400 px-3 hover:text-gray-300"
						><a href="./bemutatkozas.html">Bemutatkozás</a></span
					>
					<span
						class="mx-5 rounded-xl border border-gray-400 bg-gray-400 px-3 hover:text-gray-300"
						><a href="./tankolas.html">Tankolás</a></span
					>
				</div>
				<div class="col-span-1">
					<span id="time" class="float-right mr-8 text-slate-100"
						>00:00:00</span
					>
				</div>
			</div>
		</div>

		<div>
			<div class="m-auto text-center">
				<span class="mx-5 text-7xl">Tankolás Bevitel</span>
				<div>
					<form id="tankolasForm">
						<label for="tankolasDate">Dátum:</label>
						<input
							type="date"
							id="tankolasDate"
							name="tankolasDate"
							class="m-1 rounded-lg border bg-gray-200 p-1"
						/>
						<label for="tankolasAmount">Mennyiség (liter):</label>
						<input
							type="float"
							id="tankolasAmount"
							name="tankolasAmount"
							class="m-1 w-1/20 min-w-10 rounded-lg border bg-gray-200 p-1"
						/>
						<label for="tankloasOsszeg">Fizetett összeg</label>
						<input
							type="int"
							id="tankolasCost"
							name="tankolasCost"
							class="m-1 w-1/20 min-w-10 rounded-lg border bg-gray-200 p-1"
						/>
						<label for="tankloasOsszeg">Km óra állása</label>
						<input
							type="int"
							id="tankolasDistance"
							name="tankolasDistance"
							class="m-1 w-1/20 min-w-10 rounded-lg border bg-gray-200 p-1"
						/>
						<br />
						<button
							class="m-1 rounded-lg border bg-green-400 p-1 hover:bg-green-300"
							type="submit"
							id="tankolasSubmit"
						>
							Bevitel
						</button>
					</form>
				</div>
			</div>
		</div>
		<div class="text-center">
			<input
				type="text"
				name="datefilter"
				value=""
				id="tankolasRange"
				class="m-1 rounded-lg border bg-gray-200 p-1"
			/>
			<button
				onclick="listing(0)"
				class="m-1 rounded-lg border bg-gray-400 p-1 hover:bg-gray-300"
			>
				Listázás idő szerint
			</button>
			<button
				onclick="listing(1)"
				class="m-1 rounded-lg border bg-gray-400 p-1 hover:bg-gray-300"
			>
				Listázás hatékonyság szerint
			</button>
		</div>
		<div
			id="tankolasList"
			class="bg-neutral-primary-soft rounded-base border-default m-auto overflow-x-auto text-center"
		></div>

		<script>
			function tankolasCalc() {
				console.log(document.getElementById("tankolasSubmit").value);
			}
			setup();

			listing();
		</script>
	</body>
</html>
