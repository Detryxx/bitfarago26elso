  <body class="bg-green-200">
    <div
      class="sticky top-0 h-auto rounded-b-md bg-gray-500 py-4 text-center text-4xl"
    >
      <div class="justify-center grid grid-cols-5">
        <div class="col-span-1"></div>
        <div class="col-span-3">
          <span

          <span

        <div class="col-span-1">
          <span id="time" class="float-right mr-8 text-gray-700">00:00:00</span>
        </div>
      </div>
    </div>
    <script>
      let hour = 0;
      let minute = 0;
      let second = 0;
      function set_time() {
        const time = new Date();
        hour = time.getHours();
        minute = time.getMinutes();
        second = time.getSeconds() + 1;
      }
      function padNumber(n) {
        const str = '0' + n;
        return str.slice(-2);
      }
      function displayTime() {
        const display = document.getElementById('time');
        display.innerHTML =
          padNumber(hour) + ':' + padNumber(minute) + ':' + padNumber(second);
      }
      function timeloop() {
        displayTime();
        set_time();
        setTimeout(timeloop, 1000);
      }
      addEventListener('focus', timeloop());
    </script>
    <div>
      <div class="m-auto text-center">
        <span class="text-7xl">Tankolás Bevitel</span>
        <div>
          <form id="tankolasForm">
            <label for="tankolasDate">Dátum:</label>
            <input
              type="date"
              id="tankolasDate"
              name="tankolasDate"
              class="bg-gray-500 rounded-lg"
            />
            <label for="tankolasAmount">Mennyiség (liter):</label>
            <input
              type="float"
              id="tankolasAmount"
              name="tankolasAmount"
              class="bg-gray-500 rounded-lg w-1/20 min-w-10"
            />
            <button type="submit" id="tankolasSubmit">Bevitel</button>
          </form>
        </div>
      </div>
    </div>
  </body>
